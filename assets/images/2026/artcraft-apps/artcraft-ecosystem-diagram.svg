<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)" />
  <rect x="20" y="20" width="1160" height="760" rx="16" fill="none" stroke="#292524" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="150" height="28" rx="6" fill="#292524" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f97316" letter-spacing="0.08em">BUILT IN RUST</text>
    <text x="165" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#a8a29e">ZERO ELECTRON · ZERO SUBSCRIPTIONS</text>
    
    <text x="0" y="65" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">The ArtCraft Creative Suite Ecosystem</text>
    <text x="0" y="94" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#a8a29e">13+ native, open-source desktop applications engineered to replace Adobe &amp; commercial suites.</text>
  </g>

  <!-- Group 1: Visual & Creative Apps -->
  <g transform="translate(60, 190)">
    <!-- Column 1 Header -->
    <rect x="0" y="0" width="345" height="40" rx="8" fill="#1c1917" stroke="#292524" />
    <circle cx="20" cy="20" r="5" fill="#38bdf8" />
    <text x="35" y="25" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Design &amp; Illustration</text>

    <!-- Card: PhotoCraft -->
    <g transform="translate(0, 52)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">PhotoCraft</text>
      <rect x="110" y="13" width="130" height="20" rx="4" fill="#292524" />
      <text x="118" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Replaces Photoshop</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Layered raster editor, PSD parser,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">non-destructive filters, GPU blits.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Native WGPU acceleration</text>
    </g>

    <!-- Card: VectorCraft -->
    <g transform="translate(0, 162)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">VectorCraft</text>
      <rect x="118" y="13" width="124" height="20" rx="4" fill="#292524" />
      <text x="126" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fb923c">Replaces Illustrator</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Bézier curves, SVG/PDF engine,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">infinite zoom, boolean path tools.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Zero sub-pixel lag</text>
    </g>

    <!-- Card: DesignCraft & FigCraft -->
    <g transform="translate(0, 272)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">DesignCraft / FigCraft</text>
      <rect x="195" y="13" width="138" height="20" rx="4" fill="#292524" />
      <text x="203" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc">Replaces InDesign / Figma</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Page master layouts, UI wireframing,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">typography grid, canvas components.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Local offline canvas</text>
    </g>

    <!-- Card: LightCraft -->
    <g transform="translate(0, 382)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">LightCraft</text>
      <rect x="105" y="13" width="124" height="20" rx="4" fill="#292524" />
      <text x="113" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#67e8f9">Replaces Lightroom</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">RAW photo decoding, color grading,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">batch non-destructive development.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Instant camera RAW ingest</text>
    </g>
  </g>

  <!-- Group 2: Video, Audio & Motion -->
  <g transform="translate(425, 190)">
    <!-- Column 2 Header -->
    <rect x="0" y="0" width="345" height="40" rx="8" fill="#1c1917" stroke="#292524" />
    <circle cx="20" cy="20" r="5" fill="#a855f7" />
    <text x="35" y="25" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Video, Audio &amp; Motion</text>

    <!-- Card: FilmCraft -->
    <g transform="translate(0, 52)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">FilmCraft</text>
      <rect x="95" y="13" width="138" height="20" rx="4" fill="#292524" />
      <text x="103" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a855f7">Replaces Premiere Pro</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Multi-track video timeline, razor tool,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">hardware video encode/decode.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Near-zero scrubbing latency</text>
    </g>

    <!-- Card: EffectCraft -->
    <g transform="translate(0, 162)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">EffectCraft</text>
      <rect x="105" y="13" width="145" height="20" rx="4" fill="#292524" />
      <text x="113" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e879f9">Replaces After Effects</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Keyframe interpolation, VFX nodes,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">compositing layers &amp; particle effects.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Multi-core render pipeline</text>
    </g>

    <!-- Card: SoundCraft -->
    <g transform="translate(0, 272)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">SoundCraft</text>
      <rect x="105" y="13" width="120" height="20" rx="4" fill="#292524" />
      <text x="113" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80">Replaces Audition</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">DAW audio recording, multi-track mixing,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">spectral analysis &amp; noise gates.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Low-latency audio I/O (CPAL)</text>
    </g>

    <!-- Card: AniCraft -->
    <g transform="translate(0, 382)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">AniCraft</text>
      <rect x="90" y="13" width="124" height="20" rx="4" fill="#292524" />
      <text x="98" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f43f5e">Replaces Animate</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">2D character rigging, onion skinning,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">frame-by-frame vector timeline.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">High frame-rate playback</text>
    </g>
  </g>

  <!-- Group 3: Documents & Productivity -->
  <g transform="translate(790, 190)">
    <!-- Column 3 Header -->
    <rect x="0" y="0" width="345" height="40" rx="8" fill="#1c1917" stroke="#292524" />
    <circle cx="20" cy="20" r="5" fill="#f59e0b" />
    <text x="35" y="25" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Documents &amp; Office</text>

    <!-- Card: PdfCraft -->
    <g transform="translate(0, 52)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">PdfCraft</text>
      <rect x="90" y="13" width="142" height="20" rx="4" fill="#292524" />
      <text x="98" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ef4444">Replaces Acrobat Pro</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">PDF merger, page split/rotate,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">form fill, redaction, compression.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Blazing fast 100+ page renders</text>
    </g>

    <!-- Card: WordCraft -->
    <g transform="translate(0, 162)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">WordCraft</text>
      <rect x="105" y="13" width="115" height="20" rx="4" fill="#292524" />
      <text x="113" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Replaces MS Word</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Distraction-free writing, typography,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Markdown / DOCX / PDF export.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Sub-10ms startup time</text>
    </g>

    <!-- Card: GridCraft -->
    <g transform="translate(0, 272)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">GridCraft</text>
      <rect x="95" y="13" width="118" height="20" rx="4" fill="#292524" />
      <text x="103" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#22c55e">Replaces MS Excel</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Spreadsheet calculation engine,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">formula parsing, CSV &amp; XLSX load.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">1,000,000 row instant scroll</text>
    </g>

    <!-- Card: DeckCraft -->
    <g transform="translate(0, 382)" filter="url(#shadow)">
      <rect width="345" height="100" rx="8" fill="#171513" stroke="#292524" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f5f5f4">DeckCraft</text>
      <rect x="98" y="13" width="138" height="20" rx="4" fill="#292524" />
      <text x="106" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Replaces PowerPoint</text>
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Slide deck creation, vector shapes,</text>
      <text x="16" y="73" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">speaker notes, seamless PDF export.</text>
      <text x="16" y="91" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">Minimalist slide layouts</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 710)">
    <rect width="1075" height="42" rx="8" fill="#171513" stroke="#292524" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f4">Central Hub: ArtCraft Launcher &amp; Studio</text>
    <text x="320" y="26" font-family="system-ui, sans-serif" font-size="13" fill="#a8a29e">Also includes CADCraft (AutoCAD), TextureCraft &amp; MaterialCraft (Substance 3D).</text>
    <text x="960" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">byteportal.tech</text>
  </g>
</svg>
